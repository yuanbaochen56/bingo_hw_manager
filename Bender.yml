package:
  name: bingo_hw_manager
  authors:
    - Fanchen Kong <fanchen.kong@kuleuven.be>
    - Xiaoling Yi  <xiaoling.yi@kuleuven.be>
    - Yunhao Deng  <yunhao.deng@kuleuven.be>
dependencies:
  axi:          { git: https://github.com/pulp-platform/axi,              version:  0.39.1 }
  common_cells: { git: https://github.com/pulp-platform/common_cells.git, version:  1.37.0 }

# Port struct macros of the submodules (bingo_hw_manager/typedef.svh)
export_include_dirs:
  - include

sources:
  # Source files grouped in levels. Files in level 0 have no dependencies on files in this package.
  # Files in level 1 only depend on files in level 0.
  # Files in level 2 on files in levels 1 and 0, etc.
  # One directory per function: frontend (task fetch, dependency check, CERF),
  # interface (mailboxes, CSR port), queues, placement, replay, watchdog, control
  # (the control plane and its submodules), power, remote (level 3) and monitor
  # (event log, load monitor). The package and the top stay in src/.

  # Level 0
  - src/bingo_hw_manager_pkg.sv                            # Shared constants (task types, queue CSRs, power domains)
  - src/interface/bingo_hw_manager_mailbox_adapter.sv      # AXI Lite to Mailbox Adapter
  - src/interface/bingo_hw_manager_read_mailbox.sv         # AXI Lite read Mailbox Module
  - src/interface/bingo_hw_manager_write_mailbox.sv        # AXI Lite write Mailbox Module
  - src/frontend/bingo_hw_manager_task_queue_master.sv     # Task Queue Master Module
  - src/interface/bingo_hw_manager_csr_to_fifo_write.sv    # CSR to FIFO Write
  - src/interface/bingo_hw_manager_csr_to_fifo_read.sv     # CSR to FIFO Read
  - src/interface/bingo_hw_manager_csr_to_fifo.sv          # CSR to FIFO Interface Module
  - src/monitor/bingo_hw_manager_evlog.sv                  # Observation-only control event FIFO
  - src/monitor/bingo_hw_manager_evlog_events.sv           # Event pulses and move records of the control event log
  # Level 1
  - src/frontend/bingo_hw_manager_cond_exec_controller.sv  # Conditional execution (CERF)
  - src/monitor/bingo_hw_manager_load_monitor.sv           # Load monitor (observation only)
  - src/watchdog/bingo_hw_manager_wd_bounds.sv             # watchdog thresholds of every slot (parameter, type, learned, risk)
  - src/watchdog/bingo_hw_manager_watchdog.sv              # core state monitoring and dead core detection
  - src/watchdog/bingo_hw_manager_wd_est.sv                # compile-time task-time estimates per type/class
  - src/watchdog/bingo_hw_manager_wd_adapt.sv              # type/class progress interval bounds
  - src/watchdog/bingo_hw_manager_wd_budget.sv             # total-time budget of every slot against the estimates
  - src/placement/bingo_hw_manager_substitute_sel.sv       # Substitute of a fenced core (remap and replay)
  - src/placement/bingo_hw_manager_core_remap.sv           # Core remap selector
  - src/placement/bingo_hw_manager_router.sv               # Placement of new tasks into the slots
  - src/replay/bingo_hw_manager_replay_ctrl.sv             # Replay of a fenced core's outstanding tasks
  - src/replay/bingo_hw_manager_replay_path.sv             # Data path of replay: checkout heads in, MOVE steps out
  - src/control/bingo_hw_manager_cerf_fallback.sv          # CERF degradation of a core type with a stuck or rejected slot
  - src/control/bingo_hw_manager_wd_tick.sv                # Watchdog ticks in cycles of the normal clock (power levels)
  - src/control/bingo_hw_manager_risk.sv                   # Fault precursors: late-beat counts and at-risk slots
  - src/control/bingo_hw_manager_level_policy.sv           # Boost and derate requests of the slots to the PM
  - src/control/bingo_hw_manager_power_view.sv             # Idle and load view of the slots for the PM, recovery hold
  - src/control/bingo_hw_manager_park_fsm.sv               # Parking state of one slot
  - src/control/bingo_hw_manager_slot_table_assert.sv      # Simulation-only invariants of the slot table
  - src/control/bingo_hw_manager_slot_table.sv             # Slot mapping table (substitutes) and core parking
  - src/control/bingo_hw_manager_ctrl.sv                   # Control plane: joins the submodules above
  - src/frontend/bingo_hw_manager_dep_matrix.sv            # Dependency Matrix Module
  - src/frontend/bingo_hw_manager_dep_check_manager.sv     # Dependency Check Manager Module
  - src/frontend/bingo_hw_manager_dep_unit.sv              # waiting queues, dependency check and dependency sets (dep_matrix per cluster)
  - src/frontend/bingo_hw_manager_chiplet_dep_set.sv       # Chiplet DependencySetModule (The Master port to send chiplet dep set info to other chiplets)
  - src/frontend/bingo_hw_manager_chiplet_link.sv          # dependency sets between chiplets: out (arbiter + chiplet_dep_set), in (mailbox)
  - src/power/bingo_hw_manager_pm_policy.sv                # PM: the level each domain (DFS) or the chip (DVFS) should run at
  - src/power/bingo_hw_manager_pm.sv                       # Power Management Module
  - src/power/bingo_hw_manager_pm_counters.sv              # Cycles of each power domain per clock level, and its active cycles
  - src/remote/bingo_hw_manager_remote_link.sv             # Level 3 transport: remote dispatch / done over AXI-Lite
  - src/queues/bingo_hw_manager_ready_queue.sv             # Ready queue of a slot (CSR FIFO or AXI-Lite mailbox)
  - src/queues/bingo_hw_manager_done_queues.sv             # Done queue of every slot and what pushes into it
  - src/interface/bingo_hw_manager_csr_port.sv             # CSR port of the cores: ready reads, done writes, heartbeats
  - src/queues/bingo_hw_manager_checkout_queue.sv          # Checkout queue of a slot and the retire rule of its head
  - src/placement/bingo_hw_manager_remap_count.sv          # Tasks of a logical slot in other slots' checkout queues
  - src/remote/bingo_hw_manager_remote_export.sv           # Level 3, origin side: export queues
  - src/remote/bingo_hw_manager_remote_proxy.sv            # Level 3, origin side: state of the proxy slots
  - src/remote/bingo_hw_manager_remote_import.sv           # Level 3, executor side: imports
  - src/remote/bingo_hw_manager_remote_reply.sv            # Level 3, executor side: dones and rejects back to the origin
  - src/bingo_hw_manager_top_assert.sv                     # Simulation-only invariants of the top
  - src/bingo_hw_manager_top_log.sv                        # Simulation-only event log of the top
  # Level 2
  - src/bingo_hw_manager_top.sv                            # Top-level module
  - target: test
    # Expose every test/ subfolder as an include path so the tb `include "..._harness.svh"
    # (and the tb_stimulus_*.svh) resolve when this `test` target is pulled into an
    # external bender compile (e.g. HeMAiA's system sim uses `-t test`). Without this,
    # only compile_vsim.sh's shell-glob added the incdir, so external consumers hit
    # Error-[SFCOR] on the harness include. A tb includes files of other subfolders
    # (test/common/ holds the harness), so each subfolder needs its own entry.
    include_dirs:
      - test/4cl
      - test/base
      - test/common
      - test/exit
      - test/fallback
      - test/late_risk
      - test/park
      - test/pm
      - test/remap
      - test/remote
      - test/replay
      - test/watchdog
      - test/wd_bound
      - test/xcl
    files:
      - test/common/bingo_tb_axi_lite_stall.sv                    # helper: random AXI-Lite handshake stalls
      - test/base/tb_bingo_hw_manager_dep_matrix.sv
      - test/base/tb_bingo_hw_manager_evlog.sv
      - test/base/tb_bingo_hw_manager_evlog_age.sv
      - test/pm/tb_bingo_hw_manager_recovery_hold.sv
      - test/pm/tb_bingo_hw_manager_recovery_hold_cold.sv
      - test/pm/tb_bingo_hw_manager_pm_access_level.sv
      - test/base/tb_bingo_hw_manager_top.sv
      - test/base/tb_bingo_hw_manager_cerf_basic.sv
      - test/base/tb_bingo_hw_manager_cerf_skip.sv
      - test/fallback/tb_bingo_hw_manager_cerf_fallback.sv  # stuck core type clears one CERF group and sets another
      - test/fallback/tb_bingo_hw_manager_cerf_fallback_join.sv  # the stuck type's own tasks of the cleared group retire as skipped
      - test/fallback/tb_bingo_hw_manager_cerf_fallback_order.sv  # a lost task the CERF keeps still blocks the later skips of its core
      - test/fallback/tb_bingo_hw_manager_cerf_fallback_multi.sv  # two stuck types degrade lowest first; clear == set
      - test/fallback/tb_bingo_hw_manager_cerf_fallback_reject.sv  # a level-3 reject degrades the group; the proxy's skipped tasks retire
      - test/fallback/tb_bingo_hw_manager_cerf_fallback_double.sv      # CERF degradation: both cores of a type die, the stuck substitute drains the first one's heads
      - test/fallback/tb_bingo_hw_manager_cerf_fallback_double_off.sv  # same without ForeignStuckDrain: stays stuck (the P5b boundary)
      - test/fallback/tb_bingo_hw_manager_cerf_fallback_double_order.sv  # same with a still-needed dead-core head: it stays, nothing passes it
      - test/base/tb_bingo_hw_manager_tagged.sv      # identity-aware deps end-to-end
      - test/base/tb_bingo_hw_manager_tagged_mc.sv   # identity-aware deps, MULTI-CLUSTER cross-cluster aliasing
      - test/watchdog/tb_bingo_hw_manager_watchdog.sv
      - test/late_risk/tb_bingo_hw_manager_watchdog_risk_confirm.sv
      - test/late_risk/tb_bingo_hw_manager_watchdog_risk_confirm_detect.sv
      - test/watchdog/tb_bingo_hw_manager_watchdog_type_thr.sv
      - test/watchdog/tb_bingo_hw_manager_watchdog_type_thr_detect.sv
      - test/wd_bound/tb_bingo_hw_manager_wd_adapt.sv
      - test/wd_bound/tb_bingo_hw_manager_wd_est.sv
      - test/wd_bound/tb_bingo_hw_manager_wd_est_floor.sv
      - test/wd_bound/tb_bingo_hw_manager_wd_budget.sv
      - test/wd_bound/tb_bingo_hw_manager_wd_adapt_boundary.sv
      - test/wd_bound/tb_bingo_hw_manager_wd_adapt_execution.sv
      - test/wd_bound/tb_bingo_hw_manager_wd_adapt_replay.sv
      - test/wd_bound/tb_bingo_hw_manager_wd_adapt_layout.sv
      - test/wd_bound/tb_bingo_hw_manager_wd_adapt_layout_ci.sv
      - test/wd_bound/tb_bingo_hw_manager_wd_adapt_unavailable.sv
      - test/wd_bound/tb_bingo_hw_manager_wd_adapt_comparable.sv
      - test/wd_bound/tb_bingo_hw_manager_wd_adapt_moved.sv
      - test/wd_bound/tb_bingo_hw_manager_wd_adapt_moved_off.sv
      - test/wd_bound/tb_bingo_hw_manager_wd_adapt_fast.sv
      - test/wd_bound/tb_bingo_hw_manager_wd_adapt_fast_off.sv
      - test/late_risk/tb_bingo_hw_manager_late_window.sv
      - test/late_risk/tb_bingo_hw_manager_late_min.sv
      - test/late_risk/tb_bingo_hw_manager_late_valid.sv
      - test/late_risk/tb_bingo_hw_manager_late_learn.sv
      - test/late_risk/tb_bingo_hw_manager_late_risk.sv
      - test/late_risk/tb_bingo_hw_manager_late_frac.sv
      - test/watchdog/tb_bingo_hw_manager_type_thr_replay.sv
      - test/late_risk/tb_bingo_hw_manager_risk_confirm_replay.sv
      - test/remap/tb_bingo_hw_manager_core_remap.sv
      - test/remap/tb_bingo_hw_manager_cluster_bound_sel.sv
      - test/remap/tb_bingo_hw_manager_cluster_bound_fence.sv
      - test/remap/tb_bingo_hw_manager_cluster_bound_park.sv
      - test/fallback/tb_bingo_hw_manager_fence_fb_stuck.sv
      - test/fallback/tb_bingo_hw_manager_fence_fb_l1.sv
      - test/fallback/tb_bingo_hw_manager_fence_fb_l3.sv
      - test/fallback/tb_bingo_hw_manager_fence_fb_other.sv
      - test/fallback/tb_bingo_hw_manager_fence_fb_off.sv
      - test/fallback/tb_bingo_hw_manager_fence_fb_park.sv
      - test/exit/tb_bingo_hw_manager_exit_remap.sv
      - test/exit/tb_bingo_hw_manager_exit_replay.sv
      - test/exit/tb_bingo_hw_manager_exit_after_exit.sv
      - test/exit/tb_bingo_hw_manager_exit_own.sv
      - test/exit/tb_bingo_hw_manager_exit_l3.sv
      - test/exit/tb_bingo_hw_manager_exit_layout.sv
      - test/remap/tb_bingo_hw_manager_remap_probe.sv
      - test/remap/tb_bingo_hw_manager_remap_full_flow.sv
      - test/watchdog/tb_bingo_hw_manager_heartbeat.sv
      - test/watchdog/tb_bingo_hw_manager_heartbeat_long_task.sv
      - test/remap/tb_bingo_hw_manager_remap_passthrough.sv
      - test/remap/tb_bingo_hw_manager_remap_dead_suspect.sv
      - test/remap/tb_bingo_hw_manager_remap_busy_no_remap.sv   # healthy busy core keeps its tasks
      - test/remap/tb_bingo_hw_manager_remap_dummy_set_order.sv # dummy-set waits for its same-core source
      - test/remap/tb_bingo_hw_manager_remap_sticky_order.sv    # dead core's tasks go to one substitute, in order
      - test/remap/tb_bingo_hw_manager_remap_dummy_after_remap.sv # dummy-set waits for remapped earlier tasks
      - test/remap/tb_bingo_hw_manager_remap_mask_off.sv        # CoreRemapAllowMask='0: detection only (HeMAiA)
      - test/watchdog/tb_bingo_hw_manager_csr_heartbeat_addr.sv    # heartbeat on CSR 0x5fe + masked slot (HeMAiA)
      - test/replay/tb_bingo_hw_manager_replay_lost_task.sv       # running task of a dead core replayed
      - test/replay/tb_bingo_hw_manager_no_replay_normal.sv
      - test/replay/tb_bingo_hw_manager_replay_no_replay.sv
      - test/replay/tb_bingo_hw_manager_replay_no_replay_queued.sv
      - test/replay/tb_bingo_hw_manager_replay_no_replay_cerf.sv
      - test/replay/tb_bingo_hw_manager_replay_no_replay_l3.sv
      - test/replay/tb_bingo_hw_manager_replay_no_replay_foreign.sv
      - test/replay/tb_bingo_hw_manager_replay_no_replay_foreign_off.sv
      - test/replay/tb_bingo_hw_manager_replay_queued_tasks.sv    # queued normal/dummy/skipped entries moved in order
      - test/replay/tb_bingo_hw_manager_replay_sequencing_edge.sv # same-core edge behind the lost task
      - test/replay/tb_bingo_hw_manager_replay_slow_not_dead.sv   # silent between the timeouts: no fence
      - test/replay/tb_bingo_hw_manager_replay_zombie.sv          # fenced core's late done dropped
      - test/replay/tb_bingo_hw_manager_replay_done_race.sv       # done vs confirm timeout, exactly once
      - test/replay/tb_bingo_hw_manager_replay_no_substitute.sv   # AllowMask '0: replay_stuck, rest runs
      - test/replay/tb_bingo_hw_manager_replay_chain.sv           # substitute dies too
      - test/replay/tb_bingo_hw_manager_replay_chain_partial.sv   # substitute dies mid-MOVE: order kept
      - test/replay/tb_bingo_hw_manager_replay_stuck_other_core.sv # a stuck core does not block another replay
      - test/replay/tb_bingo_hw_manager_replay_two_clusters.sv    # replay inside cluster 1
      - test/replay/tb_bingo_hw_manager_replay_disabled.sv        # confirm timeout 0: detection only
      - test/xcl/tb_bingo_hw_manager_xcl_fallback.sv           # level 2: substitute in another cluster
      - test/xcl/tb_bingo_hw_manager_xcl_prefer_local.sv       # level 2: own cluster preferred
      - test/xcl/tb_bingo_hw_manager_xcl_prefer_local_isolated.sv  # every cluster in no partition: the own cluster still takes over
      - test/xcl/tb_bingo_hw_manager_xcl_two_faults.sv         # level 2: two dead cores, two clusters
      - test/xcl/tb_bingo_hw_manager_xcl_no_substitute.sv      # level 2: none in the chiplet, rest runs
      - test/xcl/tb_bingo_hw_manager_xcl_disabled.sv           # level 2 off (default): stuck
      - test/4cl/tb_bingo_hw_manager_4cl_l2_order.sv          # four clusters: dead DM core -> lowest other live cluster
      - test/4cl/tb_bingo_hw_manager_4cl_dm_two.sv            # four clusters: the substitute DM core dies too
      - test/4cl/tb_bingo_hw_manager_4cl_dm_three.sv          # four clusters: three DM cores die, event log of 12 slots
      - test/4cl/tb_bingo_hw_manager_4cl_gemm_cerf.sv         # four clusters: GEMM core stuck in its cluster, CERF
      - test/4cl/tb_bingo_hw_manager_4cl_spare.sv             # four clusters: a spare cluster's DM core first, then the lowest live one
      - test/4cl/tb_bingo_hw_manager_4cl_spare_change.sv      # four clusters: another spare later; fenced entries keep their substitute
      - test/4cl/tb_bingo_hw_manager_4cl_spare_park.sv        # four clusters: a parked DM core parks on the spare
      - test/4cl/tb_bingo_hw_manager_4cl_partition.sv         # four clusters, two partitions: substitutes stay in the partition, else stuck
      - test/4cl/tb_bingo_hw_manager_4cl_partition_spare.sv   # four clusters, two partitions: a spare in the other partition is not taken
      - test/4cl/tb_bingo_hw_manager_4cl_partition_park.sv    # four clusters, two partitions: parking stays in the partition
      - test/remote/tb_bingo_hw_manager_remote_dispatch.sv        # level 3: dead core's tasks run on the other chiplet
      - test/remote/tb_bingo_hw_manager_remote_full_queue.sv      # level 3: export from a full checkout queue, in order
      - test/remote/tb_bingo_hw_manager_remote_no_executor.sv     # level 3: no live core of the type anywhere
      - test/remote/tb_bingo_hw_manager_remote_done_mismatch.sv   # level 3: wrong remote done task id stops the proxy
      - test/remote/tb_bingo_hw_manager_remote_done_stray.sv      # level 3: a done / reject for no proxy slot is dropped
      - test/remote/tb_bingo_hw_manager_remote_link.sv            # level 3 transport adapter unit test
      - test/base/tb_bingo_hw_manager_chiplet_mailbox_ro.sv     # chiplet done-queue mailbox: only MBOXW is writable remotely
      - test/remote/tb_bingo_hw_manager_rlink_dispatch.sv         # level 3 over remote_link + xbar: remote_dispatch
      - test/remote/tb_bingo_hw_manager_rlink_moved.sv           # level 3 over remote_link: imported tasks are marked moved (ready queue, wd_moved_q)
      - test/remote/tb_bingo_hw_manager_rlink_full_queue.sv       # level 3 over remote_link + xbar: remote_full_queue
      - test/remote/tb_bingo_hw_manager_rlink_no_executor.sv      # level 3 over remote_link + xbar: remote_no_executor
      - test/remote/tb_bingo_hw_manager_rlink_done_order.sv       # level 3 over remote_link: two proxy slots, done order
      - test/remote/tb_bingo_hw_manager_rlink_credit_exhaust.sv   # level 3 over remote_link: one credit
      - test/remote/tb_bingo_hw_manager_rlink_hol.sv               # level 3, two peers: a peer without credits does not block the other
      - test/remote/tb_bingo_hw_manager_rlink_proxy_timeout.sv     # level 3: a lost remote done stops the proxy after the timeout
      - test/remote/tb_bingo_hw_manager_rlink_proxy_timeout_slow.sv # level 3: slow remote dones within the timeout do not trip it
      - test/remote/tb_bingo_hw_manager_rlink_loopback.sv         # level 3 over remote_link: single-chiplet loopback (force remote)
      - test/remote/tb_bingo_hw_manager_rlink_no_target.sv        # level 3 over remote_link: a type without a target is stuck, others export
      - test/remote/tb_bingo_hw_manager_rlink_reject.sv           # level 3 over remote_link: reject on import, the link keeps working
      - test/remote/tb_bingo_hw_manager_rlink_bounce.sv           # level 3 over remote_link: the executing core dies, imports bounce back
      - test/pm/tb_bingo_hw_manager_pm_fault_aware.sv         # control plane: a fenced core does not keep its power domain awake
      - test/remap/tb_bingo_hw_manager_substitute_least_loaded.sv # control plane: a dead core's tasks go to the least loaded core
      - test/pm/tb_bingo_hw_manager_pm_slow_watchdog.sv       # control plane: the watchdog counts normal-clock cycles in a slow domain
      - test/pm/tb_bingo_hw_manager_pm_recovery_boost.sv      # control plane: a dead core's substitute runs at the boost level
      - test/exit/tb_bingo_hw_manager_exit_idle.sv              # exited cores idle and stop boosting; a ready read clears exit
      - test/base/tb_bingo_hw_manager_ready_pending.sv          # non-blocking ready poll follows the CSR ready queues
      - test/pm/tb_bingo_hw_manager_pm_idle_delay.sv          # control plane: idle level only after an idle entry delay
      - test/pm/tb_bingo_hw_manager_pm_access_wake.sv         # control plane: an external access keeps the cluster awake
      - test/pm/tb_bingo_hw_manager_pm_access_wake_delay.sv   # same, with an idle entry delay
      - test/park/tb_bingo_hw_manager_park.sv                # core parking: in-flight stays, later tasks move
      - test/park/tb_bingo_hw_manager_park_no_substitute.sv  # core parking: no live substitute, request fails
      - test/park/tb_bingo_hw_manager_park_fence.sv          # core parking: a fence during the drain drops it
      - test/park/tb_bingo_hw_manager_park_sub_fence.sv        # parking: the parked core's substitute dies, a third core takes over
      - test/park/tb_bingo_hw_manager_park_sub_fence_last.sv   # parking: the substitute dies and none is left, the park fails
      - test/park/tb_bingo_hw_manager_park_target.sv           # parking: a core that runs another core's tasks cannot be parked
      - test/park/tb_bingo_hw_manager_park_mutual.sv           # parking: two cores asked at once never park onto each other
      - test/park/tb_bingo_hw_manager_park_commit.sv           # parking: no commit in the cycle the entry is recomputed
      - test/park/tb_bingo_hw_manager_unpark.sv                # parking: move back after the tasks on the substitute retired
      - test/park/tb_bingo_hw_manager_unpark_cancel.sv         # parking: move back cancelled / immediate
      - test/late_risk/tb_bingo_hw_manager_risk_park.sv             # fault precursors: late beats -> at risk -> parked, clear moves back
      - test/late_risk/tb_bingo_hw_manager_risk_derate.sv           # fault precursors: no substitute, park fails, domain derated
      - test/late_risk/tb_bingo_hw_manager_risk_decay.sv            # fault precursors: sparse late beats decay, a burst trips
      - test/pm/tb_bingo_hw_manager_boost_capacity.sv        # capacity boost: survivors of a type, budget per lost core, minimum load
      - test/pm/tb_bingo_hw_manager_boost_capacity_edges.sv  # capacity boost: lost-slot accounting, shared/derated domains, at-risk parking
      - test/pm/tb_bingo_hw_manager_pm_counters_unit.sv     # power-domain counters: random levels, DVFS, equal levels, offset domains, wrap
      - test/pm/tb_bingo_hw_manager_pm_counters_boost.sv    # power-domain counters of the top, every cycle: idle, normal, boost (fence)
      - test/pm/tb_bingo_hw_manager_pm_counters_access.sv   # power-domain counters of the top, every cycle: two domains, servo and derate levels
      - test/base/tb_bingo_hw_manager_task_queue_master.sv     # task fetch: exactly the task count, none for 0, at most one per task id
      - test/base/tb_bingo_hw_manager_task_queue_slave.sv      # task queue slave mode: the start reset outputs stay 0
      - test/base/tb_bingo_hw_manager_bus_error.sv             # bus errors: a failed descriptor read stops the fetch; PM write / read flags
      - test/pm/tb_bingo_hw_manager_pm_division.sv           # PM division writes: packed registers vs one per domain, with the host as a second writer
      - test/base/tb_bingo_hw_manager_csr_unknown.sv           # CSR port: an unknown CSR reads 0 or is ignored, never stalls
      - test/base/tb_bingo_hw_manager_chiplet_dep_set_data.sv  # chiplet dep-set write: the data is the whole descriptor, no unknown bit
      - test/base/tb_bingo_hw_manager_done_mailbox.sv          # done mailbox: a done for a slot that does not exist is dropped, never blocks
      - test/base/tb_bingo_hw_manager_waiting_depth.sv         # waiting queues of depth 2: back-pressure on the task queue, all tasks complete
      - test/park/tb_bingo_hw_manager_park_random.sv           # random graph, fault and park / move back (seeds in run_regression.sh)
      - test/remote/tb_bingo_hw_manager_rlink_random.sv           # level 3 over remote_link: random (scripts/run_replay_random.sh)
      - test/remote/tb_bingo_hw_manager_rlink_random_reject.sv    # level 3 over remote_link: random, a hang on each chiplet (rejects)
